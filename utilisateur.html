<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap – Profil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0d0b1a;
      --bg-card: #1a1728;
      --bg-card2: #211d30;
      --purple: #a855f7;
      --purple-light: #c084fc;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --text: #f1f0f5;
      --text-muted: #9490a8;
      --border: #2e2a42;
      --radius: 14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    textarea { font-family: inherit; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 180px; min-height: 100vh; background: #120f22; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 1.4rem 1rem; position: fixed; top: 0; left: 0; bottom: 0;
    }
    .sidebar-logo { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1rem; margin-bottom: 2.5rem; padding: .2rem .3rem; }
    .logo-icon { width: 30px; height: 30px; background: linear-gradient(135deg, var(--purple), var(--pink)); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: .8rem; }
    .sidebar-nav { display: flex; flex-direction: column; gap: .3rem; flex: 1; }
    .sidebar-item { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; border-radius: 8px; font-size: .88rem; color: var(--text-muted); cursor: pointer; transition: background .15s, color .15s; }
    .sidebar-item:hover { background: var(--bg-card); color: var(--text); }
    .sidebar-item.active { background: rgba(168,85,247,.15); color: var(--purple-light); font-weight: 600; }
    .sidebar-bottom { border-top: 1px solid var(--border); padding-top: 1rem; }
    .user-pill { display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: 8px; cursor: pointer; }
    .user-pill:hover { background: var(--bg-card); }
    .avatar-pill { width: 30px; height: 30px; border-radius: 8px; background: var(--bg-card2); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--text-muted); overflow: hidden; }
    .avatar-pill img { width: 100%; height: 100%; object-fit: cover; }
    .user-pill-info { flex: 1; }
    .user-pill-name { font-size: .82rem; font-weight: 600; color: var(--text-muted); }
    .user-pill-status { font-size: .7rem; color: var(--text-muted); }
    .logout-btn { background: var(--bg-card2); border: 1px solid var(--border); color: var(--text-muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: .8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logout-btn:hover { border-color: var(--purple); color: var(--text); }
    .btn-connect-sm { width: 100%; background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; color: #fff; padding: .55rem; border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600; margin-top: .5rem; transition: opacity .2s; }
    .btn-connect-sm:hover { opacity: .88; }

    .main { margin-left: 180px; flex: 1; padding: 2rem 3rem; }

    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; }

    .btn-back {
      background: var(--bg-card2); border: 1px solid var(--border); color: var(--text);
      padding: .55rem 1rem; border-radius: 10px; cursor: pointer; font-size: .85rem; transition: border-color .2s;
    }
    .btn-back:hover { border-color: var(--purple); }

    .wrap { max-width: 900px; }

    .profile-header {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-card2));
      border: 1px solid var(--border); border-radius: 18px; padding: 2rem 2.5rem;
      display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap;
    }
    .profile-avatar {
      width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; flex-shrink: 0; overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; min-width: 200px; }
    .profile-info h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: .3rem; }
    .profile-info .school { font-size: .88rem; color: var(--text-muted); margin-bottom: .6rem; }
    .profile-meta { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
    .meta-rating { font-size: .85rem; color: #fbbf24; font-weight: 600; }
    .meta-rating span { color: var(--text-muted); font-weight: 400; }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; color: #fff;
      padding: .7rem 1.3rem; border-radius: 10px; cursor: pointer; font-size: .88rem; font-weight: 700; transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .88; }

    .section-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; margin-top: 2rem; }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }

    .skill-row { display: flex; align-items: center; gap: .9rem; padding: .85rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .skill-row:last-child { border-bottom: none; }
    .skill-row:hover .skill-row-name { color: var(--purple-light); }
    .skill-cat-badge { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: rgba(168,85,247,.15); color: var(--purple-light); border-radius: 6px; padding: .2rem .5rem; flex-shrink: 0; }
    .skill-row-info { flex: 1; min-width: 0; }
    .skill-row-name { font-size: .95rem; font-weight: 600; }
    .skill-row-cost { font-size: .85rem; font-weight: 700; flex-shrink: 0; }

    .avis-row { padding: 1rem 0; border-bottom: 1px solid var(--border); }
    .avis-row:last-child { border-bottom: none; }
    .avis-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; }
    .avis-author { font-size: .88rem; font-weight: 600; }
    .avis-stars { color: #fbbf24; font-size: .85rem; }
    .avis-comment { font-size: .85rem; color: var(--text-muted); line-height: 1.5; }
    .avis-date { font-size: .72rem; color: var(--text-muted); margin-top: .3rem; }
    .avis-actions { display: flex; gap: .9rem; margin-top: .6rem; }
    .avis-action-btn { background: none; border: none; color: var(--text-muted); font-size: .75rem; cursor: pointer; padding: .2rem 0; }
    .avis-action-btn:hover { color: var(--purple-light); }

    .empty-state { color: var(--text-muted); font-size: .88rem; padding: .5rem 0; }

    .review-form { margin-top: 1rem; }
    .review-target { font-size: .85rem; color: var(--text-muted); margin-bottom: .8rem; }
    .review-form select { width: 100%; margin-bottom: 1rem; background: var(--bg-card2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: .6rem .8rem; font-size: .88rem; outline: none; }
    .review-form select:focus { border-color: var(--purple); }
    .field-label { display: block; margin-bottom: .4rem; font-size: .8rem; color: var(--text-muted); }
    .star-picker { display: flex; gap: .4rem; margin-bottom: 1rem; }
    .star-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; opacity: .35; transition: opacity .15s; }
    .star-btn.active { opacity: 1; }
    .review-form textarea {
      width: 100%; background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px;
      padding: .75rem 1rem; color: var(--text); font-size: .88rem; outline: none; margin-bottom: 1rem; resize: vertical;
    }
    .review-form textarea:focus { border-color: var(--purple); }

    .empty-page { text-align: center; padding: 4rem; color: var(--text-muted); }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 1.5rem; }
      .profile-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">
      <div class="logo-icon">S</div>
      SkillSwap
    </a>
    <nav class="sidebar-nav">
      <a href="explorer.html" class="sidebar-item active"><span>•</span> Découvrir</a>
      <div class="sidebar-item" onclick="navItem('profil')"><span>•</span> Mon profil</div>
      <div class="sidebar-item" onclick="navItem('messages')"><span>•</span> Messages</div>
      <div class="sidebar-item" onclick="navItem('jetons')"><span>•</span> Mes jetons</div>
    </nav>
    <div class="sidebar-bottom" id="sidebarBottom"></div>
  </aside>

  <!-- ═══ CONTENU PRINCIPAL ═══ -->
  <main class="main">
    <div class="top-bar">
      <button class="btn-back" onclick="history.back()">← Retour</button>
    </div>

    <div class="wrap" id="wrap">
      <div class="empty-page">Chargement…</div>
    </div>
  </main>

  <style>
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1728; border: 1px solid #a855f7; color: #f1f0f5; padding: .75rem 1.5rem; border-radius: 99px; font-size: .88rem; font-weight: 600; opacity: 0; transition: all .3s; z-index: 999; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
  <div class="toast" id="toast"></div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }
    function initiales(prenom, nom) { return ((prenom || '?')[0] + (nom || '')[0]).toUpperCase(); }
    function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch (e) { return null; } }
    function avatarHtml(photo, init) { return photo ? `<img src="${photo}" alt="">` : escapeHtml(init); }

    function deconnexion() { localStorage.removeItem('user'); window.location.href = 'index.html'; }

    function navItem(kind) {
      const user = getUser();
      if (!user) { window.location.href = 'explorer.html'; return; }
      if (kind === 'profil') window.location.href = 'profil.html';
      else if (kind === 'messages') window.location.href = 'messages.html';
      else if (kind === 'jetons') window.location.href = 'jetons.html';
    }

    function renderSidebarBottom() {
      const user = getUser();
      const el = document.getElementById('sidebarBottom');
      if (user) {
        el.innerHTML = `
          <div class="user-pill">
            <div class="avatar-pill" style="cursor:pointer;" onclick="window.location.href='profil.html'">${avatarHtml(user.photo, initiales(user.prenomUser, user.nomUser))}</div>
            <div class="user-pill-info" style="cursor:pointer;" onclick="window.location.href='profil.html'">
              <div class="user-pill-name" style="color:var(--text)">${escapeHtml((user.prenomUser || '') + ' ' + (user.nomUser || ''))}</div>
              <div class="user-pill-status">• Connecté</div>
            </div>
            <button class="logout-btn" onclick="deconnexion()" title="Se déconnecter">⎋</button>
          </div>`;
      } else {
        el.innerHTML = `
          <div class="user-pill">
            <div class="avatar-pill">👤</div>
            <div class="user-pill-info">
              <div class="user-pill-name">Invité</div>
              <div class="user-pill-status">Mode exploration</div>
            </div>
          </div>
          <button class="btn-connect-sm" onclick="window.location.href='explorer.html'">Se connecter</button>`;
      }
    }

    renderSidebarBottom();

    function afficherToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    const params = new URLSearchParams(window.location.search);
    const idProfil = params.get('id');
    const moi = getUser();

    let etoileChoisie = 0;
    let sessionAEvaluer = null;
    let sessionsAEvaluerProfil = [];
    let avisListeCourante = [];
    const editNotes = {};

    function avisRowHtml(a) {
      const esMoi = moi && String(a.idAuteur) === String(moi.idUser);
      return `
        <div class="avis-row" id="avisRow${a.idAvis}">
          <div class="avis-head">
            <span class="avis-author">${escapeHtml(a.prenomUser)} ${escapeHtml(a.nomUser)}</span>
            <span class="avis-stars">${'★'.repeat(a.note)}${'☆'.repeat(5 - a.note)}</span>
          </div>
          ${a.commentaire ? `<div class="avis-comment">${escapeHtml(a.commentaire)}</div>` : ''}
          <div class="avis-date">${escapeHtml(a.competence)} · ${new Date(a.dateAvis).toLocaleDateString('fr-FR')}</div>
          ${esMoi ? `
            <div class="avis-actions">
              <button type="button" class="avis-action-btn" onclick="activerEditionAvis(${a.idAvis})">✏️ Modifier</button>
              <button type="button" class="avis-action-btn" onclick="supprimerAvis(${a.idAvis})">🗑️ Supprimer</button>
            </div>` : ''}
        </div>`;
    }

    function activerEditionAvis(idAvis) {
      const a = avisListeCourante.find(x => x.idAvis === idAvis);
      if (!a) return;
      editNotes[idAvis] = a.note;
      const row = document.getElementById(`avisRow${idAvis}`);
      if (!row) return;

      row.innerHTML = `
        <div class="review-target">Modifie ton avis sur « ${escapeHtml(a.competence)} »</div>
        <div class="star-picker">
          ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star-btn${n <= a.note ? ' active' : ''}" data-n="${n}">★</button>`).join('')}
        </div>
        <textarea id="commentaireEdit${idAvis}" rows="3" placeholder="Un commentaire sur cette session (facultatif)…">${escapeHtml(a.commentaire || '')}</textarea>
        <div class="avis-actions">
          <button type="button" class="btn-primary" onclick="enregistrerEditionAvis(${idAvis})">Enregistrer</button>
          <button type="button" class="avis-action-btn" onclick="charger()">Annuler</button>
        </div>`;

      const boutons = row.querySelectorAll('.star-btn');
      boutons.forEach(btn => {
        btn.addEventListener('click', () => {
          editNotes[idAvis] = Number(btn.dataset.n);
          boutons.forEach(b => b.classList.toggle('active', Number(b.dataset.n) <= editNotes[idAvis]));
        });
      });
    }

    async function enregistrerEditionAvis(idAvis) {
      const note = editNotes[idAvis] || 0;
      if (note === 0) { afficherToast('Choisis une note de 1 à 5 étoiles.'); return; }
      const commentaire = document.getElementById(`commentaireEdit${idAvis}`).value.trim();

      try {
        const rep = await fetch('api/avis.php?action=modifier', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idAvis, idAuteur: moi.idUser, note, commentaire })
        });
        const json = await rep.json();
        if (!rep.ok) { afficherToast(json.erreur || 'Erreur.'); return; }
        afficherToast('Avis modifié.');
        charger();
      } catch (e) {
        afficherToast('Erreur réseau.');
      }
    }

    async function supprimerAvis(idAvis) {
      if (!confirm('Supprimer cet avis ?')) return;
      try {
        const rep = await fetch('api/avis.php?action=supprimer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idAvis, idAuteur: moi.idUser })
        });
        const json = await rep.json();
        if (!rep.ok) { afficherToast(json.erreur || 'Erreur.'); return; }
        afficherToast('Avis supprimé.');
        charger();
      } catch (e) {
        afficherToast('Erreur réseau.');
      }
    }

    async function charger() {
      const wrap = document.getElementById('wrap');

      if (!idProfil) { wrap.innerHTML = '<div class="empty-page">Profil introuvable.</div>'; return; }
      if (moi && String(moi.idUser) === String(idProfil)) { window.location.href = 'profil.html'; return; }

      try {
        const [competencesRes, statsRes, avisRes] = await Promise.all([
          fetch(`api/competences.php?action=mesCompetences&idUser=${idProfil}`),
          fetch(`api/avis.php?action=statsUtilisateur&idUser=${idProfil}`),
          fetch(`api/avis.php?action=pourUtilisateur&idUser=${idProfil}`),
        ]);
        const competencesData = await competencesRes.json();
        const statsData = await statsRes.json();
        const avisData = await avisRes.json();

        if (!competencesRes.ok) {
          wrap.innerHTML = `<div class="empty-page">${escapeHtml(competencesData.erreur || 'Profil introuvable.')}</div>`;
          return;
        }

        const competences = competencesData;
        const stats = statsRes.ok ? statsData : { moyenne: 0, totalAvis: 0, totalEchanges: 0 };
        const avisListe = avisRes.ok ? avisData : [];
        avisListeCourante = avisListe;

        // Infos de base déduites des compétences publiées (pas d'endpoint dédié "utilisateur")
        const premiere = competences[0];
        let nomComplet = 'Étudiant·e', universite = '', init = '?';
        if (premiere) {
          nomComplet = `${premiere.prenomUser || ''} ${premiere.nomUser || ''}`.trim();
          universite = premiere.universite || '';
          init = initiales(premiere.prenomUser, premiere.nomUser);
        }
        const photo = premiere ? premiere.photo : null;

        const ratingTxt = stats.totalAvis > 0
          ? `⭐ ${stats.moyenne} <span>· ${stats.totalAvis} avis</span>`
          : `<span>Pas encore d'avis</span>`;

        let html = `
          <div class="profile-header">
            <div class="profile-avatar">${avatarHtml(photo, init)}</div>
            <div class="profile-info">
              <h2>${escapeHtml(nomComplet)}</h2>
              <div class="school">${universite ? 'Étudiant·e · ' + escapeHtml(universite) : 'Étudiant·e'}</div>
              <div class="profile-meta">
                <span class="meta-rating">${ratingTxt}</span>
                <span class="meta-rating">${stats.totalEchanges} échange${stats.totalEchanges === 1 ? '' : 's'} réalisé${stats.totalEchanges === 1 ? '' : 's'}</span>
              </div>
            </div>
            ${moi ? `<button class="btn-primary" onclick="contacter('${idProfil}', '${nomComplet.replace(/'/g, "\\'")}', '${init}')">💬 Envoyer un message</button>` : ''}
          </div>

          <div class="section-title">Ce que ${escapeHtml((premiere && premiere.prenomUser) || 'cette personne')} propose</div>
          <div class="panel">
            <div id="listeCompetences">
              ${competences.length === 0
                ? '<div class="empty-state">Aucune compétence publiée pour l’instant.</div>'
                : competences.map(c => `
                  <div class="skill-row" onclick="window.location.href='competence.html?idEchange=${c.idEchange}'">
                    <span class="skill-cat-badge">${escapeHtml(c.categorie || 'Autre')}</span>
                    <div class="skill-row-info"><div class="skill-row-name">${escapeHtml(c.competence)}</div></div>
                    <div class="skill-row-cost">${c.coutHeure} 🪙/h</div>
                  </div>`).join('')}
            </div>
          </div>

          <div class="section-title">Avis reçus</div>
          <div class="panel">
            <div id="listeAvis">
              ${avisListe.length === 0
                ? '<div class="empty-state">Aucun avis pour l’instant.</div>'
                : avisListe.map(a => avisRowHtml(a)).join('')}
            </div>
          </div>

          <div id="zoneLaisserAvis"></div>`;

        wrap.innerHTML = html;

        if (moi) chargerZoneAvis();
      } catch (e) {
        wrap.innerHTML = '<div class="empty-page">Impossible de contacter le serveur. Vérifie que PHP et MySQL sont lancés.</div>';
      }
    }

    function contacter(idUser, nom, init) {
      const p = new URLSearchParams({ open: idUser, name: nom, init: init, skill: '' });
      window.location.href = 'messages.html?' + p.toString();
    }

    function texteCibleAvis(s) {
      return `Après ta session « ${escapeHtml(s.competence)} » avec ${escapeHtml(s.autrePrenom)} ${escapeHtml(s.autreNom)}, comment ça s'est passé ?`;
    }

    // N'affiche le formulaire d'avis que si au moins une session validée avec CE profil n'a pas encore été évaluée.
    // Un même profil peut avoir plusieurs sessions à évaluer (plusieurs compétences échangées) : on les propose toutes.
    async function chargerZoneAvis() {
      const zone = document.getElementById('zoneLaisserAvis');
      try {
        const rep = await fetch(`api/avis.php?action=sessionsAEvaluer&idUser=${moi.idUser}`);
        const sessions = await rep.json();
        if (!rep.ok) return;
        // On ne peut noter que la compétence publiée par CE profil (celle qu'il a enseignée),
        // pas celle que "moi" a enseignée dans un troc croisé.
        sessionsAEvaluerProfil = sessions.filter(s => String(s.idAutre) === String(idProfil) && s.autreEstEnseignant);

        if (sessionsAEvaluerProfil.length === 0) { sessionAEvaluer = null; return; }
        sessionAEvaluer = sessionsAEvaluerProfil[0];

        const selecteur = sessionsAEvaluerProfil.length > 1 ? `
          <label class="field-label">Quelle session veux-tu évaluer ?</label>
          <select id="choixSessionAvis" onchange="changerSessionAEvaluer(this.value)">
            ${sessionsAEvaluerProfil.map((s, i) => `<option value="${i}">${escapeHtml(s.competence)}${s.titre ? ' — ' + escapeHtml(s.titre) : ''}</option>`).join('')}
          </select>` : '';

        zone.innerHTML = `
          <div class="section-title">Laisser un avis</div>
          <div class="panel review-form">
            ${selecteur}
            <div class="review-target" id="reviewTarget">${texteCibleAvis(sessionAEvaluer)}</div>
            <div class="star-picker" id="starPicker">
              ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star-btn" data-n="${n}">★</button>`).join('')}
            </div>
            <textarea id="commentaireAvis" rows="3" placeholder="Un commentaire sur cette session (facultatif)…"></textarea>
            <button class="btn-primary" style="width:100%" onclick="envoyerAvis()">Envoyer mon avis</button>
          </div>`;

        initStarPicker();
      } catch (e) {
        // silencieux : la zone d'avis est un bonus, pas bloquant
      }
    }

    function changerSessionAEvaluer(idx) {
      sessionAEvaluer = sessionsAEvaluerProfil[Number(idx)];
      document.getElementById('reviewTarget').innerHTML = texteCibleAvis(sessionAEvaluer);
      etoileChoisie = 0;
      document.querySelectorAll('#starPicker .star-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('commentaireAvis').value = '';
    }

    function initStarPicker() {
      etoileChoisie = 0;
      const boutons = document.querySelectorAll('#starPicker .star-btn');
      boutons.forEach(btn => {
        btn.addEventListener('click', () => {
          etoileChoisie = Number(btn.dataset.n);
          boutons.forEach(b => b.classList.toggle('active', Number(b.dataset.n) <= etoileChoisie));
        });
      });
    }

    async function envoyerAvis() {
      if (!sessionAEvaluer) return;
      if (etoileChoisie === 0) { afficherToast('Choisis une note de 1 à 5 étoiles.'); return; }

      const commentaire = document.getElementById('commentaireAvis').value.trim();

      try {
        const rep = await fetch('api/avis.php?action=laisser', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idSession: sessionAEvaluer.idSession, idAuteur: moi.idUser, note: etoileChoisie, commentaire })
        });
        const json = await rep.json();
        if (!rep.ok) { afficherToast(json.erreur || 'Erreur.'); return; }

        afficherToast('Avis envoyé, merci !');
        charger();
      } catch (e) {
        afficherToast('Erreur réseau.');
      }
    }

    charger();
  </script>

</body>
</html>
