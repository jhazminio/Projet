<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap – Détail de la compétence</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0d0b1a;
      --bg-card: #1a1728;
      --bg-card2: #211d30;
      --purple: #a855f7;
      --purple-light: #c084fc;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --text: #f1f0f5;
      --text-muted: #9490a8;
      --border: #2e2a42;
      --radius: 14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 180px; min-height: 100vh; background: #120f22; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 1.4rem 1rem; position: fixed; top: 0; left: 0; bottom: 0;
    }
    .sidebar-logo { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1rem; margin-bottom: 2.5rem; padding: .2rem .3rem; }
    .logo-icon { width: 30px; height: 30px; background: linear-gradient(135deg, var(--purple), var(--pink)); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: .8rem; }
    .sidebar-nav { display: flex; flex-direction: column; gap: .3rem; flex: 1; }
    .sidebar-item { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; border-radius: 8px; font-size: .88rem; color: var(--text-muted); cursor: pointer; transition: background .15s, color .15s; }
    .sidebar-item:hover { background: var(--bg-card); color: var(--text); }
    .sidebar-item.active { background: rgba(168,85,247,.15); color: var(--purple-light); font-weight: 600; }
    .sidebar-bottom { border-top: 1px solid var(--border); padding-top: 1rem; }
    .user-pill { display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: 8px; cursor: pointer; }
    .user-pill:hover { background: var(--bg-card); }
    .avatar-pill { width: 30px; height: 30px; border-radius: 8px; background: var(--bg-card2); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--text-muted); overflow: hidden; }
    .avatar-pill img { width: 100%; height: 100%; object-fit: cover; }
    .user-pill-info { flex: 1; }
    .user-pill-name { font-size: .82rem; font-weight: 600; color: var(--text-muted); }
    .user-pill-status { font-size: .7rem; color: var(--text-muted); }
    .logout-btn { background: var(--bg-card2); border: 1px solid var(--border); color: var(--text-muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: .8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logout-btn:hover { border-color: var(--purple); color: var(--text); }
    .btn-connect-sm { width: 100%; background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; color: #fff; padding: .55rem; border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600; margin-top: .5rem; transition: opacity .2s; }
    .btn-connect-sm:hover { opacity: .88; }

    .main { margin-left: 180px; flex: 1; padding: 2rem 3rem; }

    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; }

    .btn-back {
      background: var(--bg-card2); border: 1px solid var(--border); color: var(--text);
      padding: .55rem 1rem; border-radius: 10px; cursor: pointer; font-size: .85rem; transition: border-color .2s;
    }
    .btn-back:hover { border-color: var(--purple); }

    .layout {
      display: grid; grid-template-columns: 1fr 380px; gap: 1.8rem;
      max-width: 1280px; margin: 0 auto; position: relative;
    }

    /* Halos décoratifs immersifs derrière le contenu */
    .layout::before, .layout::after {
      content: ''; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none;
    }
    .layout::before {
      top: -120px; left: -10%; width: 460px; height: 460px;
      background: radial-gradient(circle, rgba(168,85,247,.22) 0%, transparent 70%);
    }
    .layout::after {
      bottom: -160px; right: -5%; width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(236,72,153,.18) 0%, transparent 70%);
    }

    .main-col { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }

    .thumb { height: 260px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .thumb::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,.09) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }
    .thumb-icon { font-size: 5.5rem; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
    .thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

    .floating-rating {
      position: absolute; top: 1rem; right: 1rem; z-index: 2;
      background: rgba(13,11,26,.55); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.15); border-radius: 99px;
      padding: .45rem .9rem; font-size: .82rem; font-weight: 700; color: #fbbf24;
    }

    .floating-cost {
      position: absolute; bottom: 1rem; left: 1rem; z-index: 2;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border-radius: 10px; padding: .5rem 1rem; font-size: .85rem; font-weight: 700;
      box-shadow: 0 10px 28px rgba(168,85,247,.4);
      display: flex; align-items: center; gap: .35rem;
    }

    .thumb.Musique       { background: linear-gradient(135deg, #3a1c71, #6a0572); }
    .thumb.Programmation { background: linear-gradient(135deg, #0f0c29, #302b63); }
    .thumb.Sport         { background: linear-gradient(135deg, #b91c1c, #f97316); }
    .thumb.Mathématiques { background: linear-gradient(135deg, #134e5e, #1a6b4a); }
    .thumb.Langues       { background: linear-gradient(135deg, #0a6473, #135e72); }
    .thumb.Danse         { background: linear-gradient(135deg, #9d174d, #db2777); }
    .thumb.Informatique  { background: linear-gradient(135deg, #1e3a8a, #2563eb); }
    .thumb.Sciences      { background: linear-gradient(135deg, #065f46, #10b981); }
    .thumb.Arts          { background: linear-gradient(135deg, #3b0764, #7e22ce); }
    .thumb.Théâtre       { background: linear-gradient(135deg, #7c2d12, #c2410c); }
    .thumb.Photographie  { background: linear-gradient(135deg, #1e1b4b, #4338ca); }
    .thumb.Dessin        { background: linear-gradient(135deg, #831843, #be185d); }
    .thumb.Autre         { background: linear-gradient(135deg, #27272a, #3f3f46); }

    .code-lines { display: flex; flex-direction: column; gap: 6px; padding: 1.4rem; width: 60%; }
    .code-lines span { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #a855f7, #22d3ee); }
    .lang-bubbles { display: flex; flex-direction: column; gap: .5rem; padding: .5rem; }
    .bubble { padding: .3rem .8rem; border-radius: 99px; font-size: .85rem; font-weight: 600; }
    .bubble.left  { background: var(--purple); align-self: flex-start; }
    .bubble.right { background: #fff; color: #111; align-self: flex-end; }
    .design-shapes { display: flex; gap: .7rem; align-items: center; }
    .shape-sq { width: 54px; height: 54px; background: var(--purple); border-radius: 8px; }
    .shape-ci { width: 50px; height: 50px; background: var(--pink); border-radius: 50%; }
    .shape-ln { width: 8px; height: 72px; background: var(--cyan); border-radius: 4px; }
    .maths-text { font-family: 'Georgia', serif; text-align: center; font-size: 1.05rem; line-height: 1.8; color: #d1fae5; }

    .content { padding: 1.6rem 2rem 2rem; }

    .cat-badge {
      display: inline-block; background: rgba(168,85,247,.15); color: var(--purple-light);
      border-radius: 6px; padding: .3rem .8rem; font-size: .78rem; font-weight: 700; margin-bottom: 1rem;
    }

    .content h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: .6rem; }

    .meta-line { font-size: .88rem; color: var(--text-muted); margin-bottom: 1.4rem; }
    .meta-line strong { color: #fbbf24; }

    .description { font-size: .92rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 1.6rem; }

    .info-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .info-chip {
      background: var(--bg-card2); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.1rem 1.1rem 1rem; position: relative; overflow: hidden; transition: border-color .2s, transform .2s;
    }
    .info-chip:hover { border-color: var(--purple); transform: translateY(-2px); }
    .info-chip::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--purple), var(--cyan));
    }
    .info-chip .icon { font-size: 1.3rem; display: block; margin-bottom: .5rem; }
    .info-chip .label { font-size: .85rem; font-weight: 700; margin-bottom: .3rem; }
    .info-chip .sub { font-size: .76rem; color: var(--text-muted); line-height: 1.4; }

    /* ── Colonne de droite ── */
    .side-col {
      background: linear-gradient(160deg, var(--bg-card), var(--bg-card2));
      border: 1px solid var(--border); border-radius: 20px; padding: 1.8rem; height: fit-content;
      position: relative; overflow: hidden;
    }
    .side-col::before {
      content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(34,211,238,.16) 0%, transparent 70%); pointer-events: none;
    }

    .author-block { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 1.4rem; cursor: pointer; position: relative; z-index: 1; }
    .author-avatar {
      width: 68px; height: 68px; border-radius: 18px; background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.35rem;
      margin-bottom: .8rem; overflow: hidden; box-shadow: 0 0 0 3px rgba(168,85,247,.25);
    }
    .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .author-name { font-size: 1rem; font-weight: 700; }
    .author-name:hover { color: var(--purple-light); }
    .author-sub { font-size: .8rem; color: var(--text-muted); margin-top: .2rem; }

    .cost-box {
      background: linear-gradient(135deg, rgba(168,85,247,.18), rgba(236,72,153,.12));
      border: 1px solid rgba(168,85,247,.3); border-radius: 12px; padding: 1.2rem; text-align: center;
      margin-bottom: 1.2rem; position: relative; z-index: 1;
    }
    .cost-box .bal-label { font-size: .78rem; color: var(--text-muted); margin-bottom: .4rem; }
    .cost-box .bal-amount { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: .4rem; }

    .btn-primary {
      width: 100%; background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; color: #fff;
      padding: .9rem; border-radius: 10px; font-size: .95rem; font-weight: 700; cursor: pointer; transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .hint { text-align: center; font-size: .78rem; color: var(--text-muted); margin-top: .8rem; }

    .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }

    @media (max-width: 900px) {
      .main { padding: 1.5rem; }
      .layout { grid-template-columns: 1fr; }
      .info-chips { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">
      <div class="logo-icon">S</div>
      SkillSwap
    </a>
    <nav class="sidebar-nav">
      <a href="explorer.html" class="sidebar-item active"><span>•</span> Découvrir</a>
      <div class="sidebar-item" onclick="navItem('profil')"><span>•</span> Mon profil</div>
      <div class="sidebar-item" onclick="navItem('messages')"><span>•</span> Messages</div>
      <div class="sidebar-item" onclick="navItem('jetons')"><span>•</span> Mes jetons</div>
    </nav>
    <div class="sidebar-bottom" id="sidebarBottom"></div>
  </aside>

  <!-- ═══ CONTENU PRINCIPAL ═══ -->
  <main class="main">
    <div class="top-bar">
      <button class="btn-back" onclick="window.location.href='explorer.html'">← Retour</button>
    </div>

    <div id="contenu" class="layout">
      <div class="empty-state">Chargement…</div>
    </div>
  </main>

  <style>
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1728; border: 1px solid #a855f7; color: #f1f0f5; padding: .75rem 1.5rem; border-radius: 99px; font-size: .88rem; font-weight: 600; opacity: 0; transition: all .3s; z-index: 999; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
  <div class="toast" id="toast"></div>

  <script>
    const CAT_ICON_HTML = {
      Musique: '<span class="thumb-icon">🎸</span>',
      Programmation: '<div class="code-lines"><span style="width:80%"></span><span style="width:55%"></span><span style="width:70%"></span><span style="width:45%"></span></div>',
      Sport: '<span class="thumb-icon">🏀</span>',
      Mathématiques: '<div class="maths-text">a² + b² = c²<br>∫ x dx = ½x²<br>π ≈ 3.14159</div>',
      Langues: '<div class="lang-bubbles"><div class="bubble left">Hello</div><div class="bubble right">Bonjour</div></div>',
      Danse: '<span class="thumb-icon">💃</span>',
      Informatique: '<span class="thumb-icon">💻</span>',
      Sciences: '<span class="thumb-icon">🔬</span>',
      Arts: '<div class="design-shapes"><div class="shape-sq"></div><div class="shape-ci"></div><div class="shape-ln"></div></div>',
      Théâtre: '<span class="thumb-icon">🎭</span>',
      Photographie: '<span class="thumb-icon">📷</span>',
      Dessin: '<span class="thumb-icon">✏️</span>',
      Autre: '<span class="thumb-icon">✨</span>',
    };

    const FORMAT_LABELS = {
      virtuel: { label: '💻 En visio', sub: 'Sessions à distance uniquement' },
      presentiel: { label: '📍 Sur le campus', sub: 'Sessions en présentiel uniquement' },
      les_deux: { label: '💻📍 Visio ou campus', sub: "Au choix selon ce qui arrange les deux" },
    };

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }
    function initiales(prenom, nom) { return ((prenom || '?')[0] + (nom || '')[0]).toUpperCase(); }
    function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch (e) { return null; } }
    function avatarHtml(photo, init) { return photo ? `<img src="${photo}" alt="">` : escapeHtml(init); }

    function deconnexion() { localStorage.removeItem('user'); window.location.href = 'index.html'; }

    function navItem(kind) {
      const user = getUser();
      if (!user) { window.location.href = 'explorer.html'; return; }
      if (kind === 'profil') window.location.href = 'profil.html';
      else if (kind === 'messages') window.location.href = 'messages.html';
      else if (kind === 'jetons') window.location.href = 'jetons.html';
    }

    function renderSidebarBottom() {
      const user = getUser();
      const el = document.getElementById('sidebarBottom');
      if (user) {
        el.innerHTML = `
          <div class="user-pill">
            <div class="avatar-pill" style="cursor:pointer;" onclick="window.location.href='profil.html'">${avatarHtml(user.photo, initiales(user.prenomUser, user.nomUser))}</div>
            <div class="user-pill-info" style="cursor:pointer;" onclick="window.location.href='profil.html'">
              <div class="user-pill-name" style="color:var(--text)">${escapeHtml((user.prenomUser || '') + ' ' + (user.nomUser || ''))}</div>
              <div class="user-pill-status">• Connecté</div>
            </div>
            <button class="logout-btn" onclick="deconnexion()" title="Se déconnecter">⎋</button>
          </div>`;
      } else {
        el.innerHTML = `
          <div class="user-pill">
            <div class="avatar-pill">👤</div>
            <div class="user-pill-info">
              <div class="user-pill-name">Invité</div>
              <div class="user-pill-status">Mode exploration</div>
            </div>
          </div>
          <button class="btn-connect-sm" onclick="window.location.href='explorer.html'">Se connecter</button>`;
      }
    }

    renderSidebarBottom();

    function afficherToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    const params = new URLSearchParams(window.location.search);
    const idEchange = params.get('idEchange');

    async function charger() {
      const conteneur = document.getElementById('contenu');
      if (!idEchange) {
        conteneur.innerHTML = '<div class="empty-state">Compétence introuvable.</div>';
        return;
      }

      try {
        const rep = await fetch(`api/competences.php?action=detail&idEchange=${idEchange}`);
        const item = await rep.json();
        if (!rep.ok) {
          conteneur.innerHTML = `<div class="empty-state">${escapeHtml(item.erreur || 'Compétence introuvable.')}</div>`;
          return;
        }

        const user = getUser();
        const estMoi = user && String(item.idUser) === String(user.idUser);
        const cat = item.categorie || 'Autre';
        const init = initiales(item.prenomUser, item.nomUser);
        const nomComplet = `${item.prenomUser} ${item.nomUser}`;
        const ratingTxt = item.nbAvis > 0 ? `⭐ ${Number(item.noteMoyenne).toFixed(1)} · ${item.nbAvis} avis` : 'Pas encore d’avis';

        document.title = `SkillSwap – ${item.competence}`;

        const fmt = FORMAT_LABELS[item.format] || FORMAT_LABELS.virtuel;

        conteneur.innerHTML = `
          <div class="main-col">
            <div class="thumb ${cat}">
              ${item.image ? `<img class="thumb-img" src="${item.image}" alt="">` : (CAT_ICON_HTML[cat] || CAT_ICON_HTML.Autre)}
              <div class="floating-rating">${ratingTxt}</div>
              <div class="floating-cost">🪙 ${item.coutHeure} jeton${item.coutHeure > 1 ? 's' : ''}/h</div>
            </div>
            <div class="content">
              <span class="cat-badge">${escapeHtml(cat)}</span>
              <h1>${escapeHtml(item.competence)}</h1>
              <div class="meta-line">${item.nbEchanges} échange${item.nbEchanges === 1 ? '' : 's'} réalisé${item.nbEchanges === 1 ? '' : 's'} avec cette compétence</div>
              <p class="description">${item.description ? escapeHtml(item.description) : "Aucune description fournie pour l'instant."}</p>
              <div class="info-chips">
                <div class="info-chip">
                  <span class="icon">🗓️</span>
                  <div class="label">1h / séance</div>
                  <div class="sub">${fmt.label}</div>
                </div>
                <div class="info-chip">
                  <span class="icon">🎁</span>
                  <div class="label">Support inclus</div>
                  <div class="sub">${item.support ? escapeHtml(item.support) : 'Aucun support précisé pour l’instant'}</div>
                </div>
                <div class="info-chip">
                  <span class="icon">🪙</span>
                  <div class="label">${item.coutHeure} jeton${item.coutHeure > 1 ? 's' : ''}</div>
                  <div class="sub">rendu en donnant à ton tour</div>
                </div>
              </div>
            </div>
          </div>

          <div class="side-col">
            <div class="author-block" onclick="window.location.href='utilisateur.html?id=${item.idUser}'">
              <div class="author-avatar">${avatarHtml(item.photo, init)}</div>
              <div class="author-name">${escapeHtml(nomComplet)}</div>
              <div class="author-sub">${escapeHtml(item.universite || 'Étudiant·e')}</div>
            </div>

            <div class="cost-box">
              <div class="bal-label">Coût de l'échange</div>
              <div class="bal-amount">${item.coutHeure} jeton${item.coutHeure > 1 ? 's' : ''}/h 🪙</div>
            </div>

            ${estMoi
              ? `<p class="hint">C'est ta propre publication.</p>`
              : `<button class="btn-primary" onclick="proposerEchange('${item.idUser}', '${escapeHtml(nomComplet).replace(/'/g, "\\'")}', '${init}')">🤝 Proposer un échange</button>
                 <p class="hint">Tu seras mis·e en relation directement.</p>`}
          </div>`;
      } catch (e) {
        conteneur.innerHTML = '<div class="empty-state">Impossible de contacter le serveur. Vérifie que PHP et MySQL sont lancés.</div>';
      }
    }

    function proposerEchange(idUser, nom, init) {
      const user = getUser();
      if (!user) { window.location.href = 'explorer.html'; return; }
      const p = new URLSearchParams({ open: idUser, name: nom, init: init, skill: '' });
      window.location.href = 'messages.html?' + p.toString();
    }

    charger();
  </script>

</body>
</html>
