<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap – Créer mon compte</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0b1a;
      --card: #1a1728;
      --card2: #211d30;
      --purple: #a855f7;
      --purple-l: #c084fc;
      --pink: #ec4899;
      --text: #f1f0f5;
      --muted: #9490a8;
      --border: #2e2a42;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.8rem;
      width: 100%;
      max-width: 460px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: .9rem;
    }

    h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: .4rem; }

    .subtitle { font-size: .88rem; color: var(--muted); margin-bottom: 2rem; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1.1rem; }

    .field label {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .field input {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: .78rem 1rem;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }

    .field input::placeholder { color: var(--muted); }
    .field input:focus { border-color: var(--purple); }

    .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }

    .chip {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: .35rem .9rem;
      font-size: .82rem;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      user-select: none;
    }

    .chip:hover { border-color: var(--purple); color: var(--purple-l); }

    .chip.on {
      background: rgba(168,85,247,.2);
      border-color: var(--purple);
      color: var(--purple-l);
      font-weight: 600;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      color: #fff;
      padding: .95rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: .5rem;
      margin-bottom: 1.2rem;
      transition: opacity .2s;
    }

    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .login-link { text-align: center; font-size: .85rem; color: var(--muted); }

    .login-link a {
      color: var(--purple-l);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .login-link a:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--purple);
      color: var(--text);
      padding: .75rem 1.6rem;
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 600;
      opacity: 0;
      transition: all .3s;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err  { border-color: var(--pink); }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }

    .overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.2rem;
      width: 100%;
      max-width: 370px;
      text-align: center;
    }

    .modal h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: .4rem; }
    .modal p  { font-size: .85rem; color: var(--muted); margin-bottom: 1.4rem; }

    .modal input {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: .78rem 1rem;
      color: var(--text);
      font-size: .92rem;
      outline: none;
      margin-bottom: .8rem;
      transition: border-color .2s;
    }

    .modal input:focus { border-color: var(--purple); }
    .modal input::placeholder { color: var(--muted); }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none; color: #fff;
      padding: .85rem; border-radius: 10px;
      font-size: .95rem; font-weight: 700;
      cursor: pointer; margin-bottom: .6rem;
      transition: opacity .2s;
    }

    .btn-primary:hover { opacity: .88; }

    .btn-ghost {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: .85rem; border-radius: 10px;
      font-size: .9rem; cursor: pointer;
      transition: border-color .2s;
    }

    .btn-ghost:hover { border-color: var(--purple); color: var(--text); }

    @media (max-width: 500px) {
      .card { padding: 2rem 1.5rem; }
      .row  { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="card">

    <a href="index.html" class="logo" style="text-decoration:none;color:inherit">
      <div class="logo-icon">S</div>
      SkillSwap
    </a>

    <h2>Créer mon compte</h2>
    <p class="subtitle">Rejoins la communauté et échange tes compétences.</p>

    <div class="row">
      <div class="field">
        <label>Nom</label>
        <input type="text" id="nom" placeholder="Durand" />
      </div>
      <div class="field">
        <label>Prénom</label>
        <input type="text" id="prenom" placeholder="Camille" />
      </div>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="camille.durand@email.com" />
    </div>

    <div class="field">
      <label>Université</label>
      <input type="text" id="universite" placeholder="Université de Lyon" />
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="mdp" placeholder="••••••••" />
    </div>

    <div class="field">
      <label>Compétences <span style="color:var(--pink)">· min. 1</span></label>
      <div class="chips" id="chips">
        <span class="chip" onclick="toggle(this)">Musique</span>
        <span class="chip" onclick="toggle(this)">Programmation</span>
        <span class="chip" onclick="toggle(this)">Sport</span>
        <span class="chip" onclick="toggle(this)">Mathématiques</span>
        <span class="chip" onclick="toggle(this)">Langues</span>
        <span class="chip" onclick="toggle(this)">Danse</span>
        <span class="chip" onclick="toggle(this)">Informatique</span>
        <span class="chip" onclick="toggle(this)">Sciences</span>
        <span class="chip" onclick="toggle(this)">Arts</span>
        <span class="chip" onclick="toggle(this)">Théâtre</span>
        <span class="chip" onclick="toggle(this)">Photographie</span>
        <span class="chip" onclick="toggle(this)">Dessin</span>
      </div>
    </div>

    <button class="btn" id="btnSubmit" onclick="inscrire()">Créer mon compte</button>

    <p class="login-link">Déjà membre ? <a onclick="ouvrirModal()">Se connecter</a></p>
  </div>

  <div class="overlay" id="overlay" onclick="fermerSiDehors(event)">
    <div class="modal">
      <h3>Connecte-toi</h3>
      <p>Entre tes identifiants pour accéder à ton profil.</p>
      <input type="email"    id="l-email" placeholder="Email" />
      <input type="password" id="l-mdp"   placeholder="Mot de passe" />
      <button class="btn-primary" onclick="connecter()">Se connecter</button>
      <button class="btn-ghost"   onclick="fermerModal()">Annuler</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = 'api';

    function toast(msg, err = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (err ? ' err' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    function toggle(el) { el.classList.toggle('on'); }

    async function inscrire() {
      const nom         = document.getElementById('nom').value.trim();
      const prenom      = document.getElementById('prenom').value.trim();
      const email       = document.getElementById('email').value.trim();
      const universite  = document.getElementById('universite').value.trim();
      const mdp         = document.getElementById('mdp').value;
      const competences = [...document.querySelectorAll('.chip.on')].map(c => c.textContent);

      if (!nom)                    { toast('Le nom est obligatoire.', true); return; }
      if (!prenom)                 { toast('Le prénom est obligatoire.', true); return; }
      if (!email)                  { toast("L'email est obligatoire.", true); return; }
      if (!mdp)                    { toast('Le mot de passe est obligatoire.', true); return; }
      if (competences.length === 0){ toast('Sélectionne au moins une compétence.', true); return; }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Création en cours…';

      try {
        const rep  = await fetch(`${API}/auth.php?action=inscription`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nomUser: nom, prenomUser: prenom, email, universite, motDePasse: mdp, competences })
        });
        const json = await rep.json();

        if (!rep.ok) {
          toast(json.erreur, true);
          btn.disabled = false;
          btn.textContent = 'Créer mon compte';
          return;
        }

        localStorage.setItem('user', JSON.stringify(json));
        toast('Compte créé ! Redirection…');
        setTimeout(() => window.location.href = 'explorer.html', 1200);

      } catch (e) {
        toast('Erreur réseau. XAMPP est-il lancé ?', true);
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    }

    async function connecter() {
      const email = document.getElementById('l-email').value.trim();
      const mdp   = document.getElementById('l-mdp').value;
      if (!email || !mdp) { toast('Remplis les deux champs.', true); return; }

      try {
        const rep  = await fetch(`${API}/auth.php?action=connexion`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, motDePasse: mdp })
        });
        const json = await rep.json();
        if (!rep.ok) { toast(json.erreur, true); return; }

        localStorage.setItem('user', JSON.stringify(json.user));
        window.location.href = 'profil.html';

      } catch (e) {
        toast('Erreur réseau. XAMPP est-il lancé ?', true);
      }
    }

    function ouvrirModal()     { document.getElementById('overlay').classList.add('open'); }
    function fermerModal()     { document.getElementById('overlay').classList.remove('open'); }
    function fermerSiDehors(e) { if (e.target === document.getElementById('overlay')) fermerModal(); }
  </script>

</body>
</html>
