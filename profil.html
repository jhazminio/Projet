<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap – Mon profil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0d0b1a;
      --bg-card: #1a1728;
      --bg-card2: #211d30;
      --sidebar: #120f22;
      --purple: #a855f7;
      --purple-light: #c084fc;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --text: #f1f0f5;
      --text-muted: #9490a8;
      --border: #2e2a42;
      --radius: 14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── SIDEBAR (identique à explorer.html) ── */
    .sidebar {
      width: 180px;
      min-height: 100vh;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.4rem 1rem;
      position: fixed;
      top: 0; left: 0; bottom: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      padding: .2rem .3rem;
    }

    .logo-icon {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: .8rem;
    }

    .sidebar-nav { display: flex; flex-direction: column; gap: .3rem; flex: 1; }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .6rem .8rem;
      border-radius: 8px;
      font-size: .88rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .sidebar-item:hover { background: var(--bg-card); color: var(--text); }

    .sidebar-item.active {
      background: rgba(168,85,247,.15);
      color: var(--purple-light);
      font-weight: 600;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .5rem .6rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .user-pill:hover { background: var(--bg-card); }

    .avatar-pill {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 700;
    }

    .user-pill-name   { font-size: .82rem; font-weight: 600; }
    .user-pill-status { font-size: .7rem; color: var(--text-muted); }

    .logout-btn {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 24px; height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
      display: flex; align-items: center; justify-content: center;
      margin-left: auto;
    }
    .logout-btn:hover { border-color: var(--purple); color: var(--text); }

    /* ── CONTENU PRINCIPAL ── */
    .main {
      margin-left: 180px;
      flex: 1;
      padding: 2.5rem 3rem;
    }

    /* ── CARTE EN-TÊTE DU PROFIL ── */
    .profile-header {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-card2));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 2.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .profile-header::before {
      content: '';
      position: absolute;
      top: -40px; left: -40px;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(168,85,247,.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .profile-avatar {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.4rem;
      flex-shrink: 0;
    }

    .profile-info { flex: 1; }

    .profile-info h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: .3rem; }
    .profile-info .school { font-size: .88rem; color: var(--text-muted); }
    .profile-info .email { font-size: .8rem; color: var(--text-muted); margin-top: .2rem; }

    /* ── SECTION COMPÉTENCES ── */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: .8rem;
    }

    .section-title h3 { font-size: 1.2rem; font-weight: 700; }

    .btn-publish {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      color: #fff;
      padding: .4rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      transition: opacity .2s;
    }

    .btn-publish:hover { opacity: .88; }

    .skills-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 560px;
    }

    /* Une ligne de compétence */
    .skill-row {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .85rem 0;
      border-bottom: 1px solid var(--border);
    }

    .skill-row:last-child { border-bottom: none; }

    .skill-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #34d399;
      flex-shrink: 0;
    }

    .skill-row-info { flex: 1; }
    .skill-row-name { font-size: .95rem; font-weight: 600; }
    .skill-row-date { font-size: .76rem; color: var(--text-muted); margin-top: .15rem; }

    .empty-state { color: var(--text-muted); font-size: .88rem; padding: .5rem 0; }

    /* ── MODAL PUBLIER ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; z-index: 300;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      padding: 2.2rem; width: 100%; max-width: 400px;
    }
    .modal-box h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: .5rem; }
    .modal-box p { font-size: .85rem; color: var(--text-muted); margin-bottom: 1.2rem; }
    .modal-box input {
      width: 100%; background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px;
      padding: .75rem 1rem; color: var(--text); font-size: .9rem; outline: none; margin-bottom: 1rem;
      transition: border-color .2s;
    }
    .modal-box input:focus { border-color: var(--purple); }
    .btn-modal-p {
      width: 100%; background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; color: #fff;
      padding: .8rem; border-radius: 10px; font-size: .95rem; font-weight: 600; cursor: pointer; margin-bottom: .6rem;
      transition: opacity .2s;
    }
    .btn-modal-p:hover { opacity: .88; }
    .btn-modal-p:disabled { opacity: .5; cursor: not-allowed; }
    .btn-modal-g {
      width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text);
      padding: .8rem; border-radius: 10px; font-size: .9rem; cursor: pointer;
    }
    .btn-modal-g:hover { border-color: var(--purple); }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 1.5rem; }
      .profile-header { flex-direction: column; align-items: flex-start; }
      .skills-panel { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">
      <div class="logo-icon">S</div>
      SkillSwap
    </a>

    <nav class="sidebar-nav">
      <a href="explorer.html" class="sidebar-item">
        <span>•</span> Découvrir
      </a>
      <div class="sidebar-item active">
        <span>•</span> Mon profil
      </div>
      <div class="sidebar-item" onclick="window.location.href='messages.html'">
        <span>•</span> Messages
      </div>
      <div class="sidebar-item" onclick="afficherToast('Mes jetons — bientôt disponible')">
        <span>•</span> Mes jetons
      </div>
    </nav>

    <div class="sidebar-bottom">
      <div class="user-pill">
        <div class="avatar-pill" id="sidebarAvatar"></div>
        <div style="flex:1">
          <div class="user-pill-name" id="sidebarName"></div>
          <div class="user-pill-status">• Connecté</div>
        </div>
        <button class="logout-btn" onclick="deconnexion()" title="Se déconnecter">⎋</button>
      </div>
    </div>
  </aside>

  <!-- ═══ CONTENU PRINCIPAL ═══ -->
  <main class="main">

    <!-- En-tête du profil -->
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar"></div>
      <div class="profile-info">
        <h2 id="profileName"></h2>
        <div class="school" id="profileSchool"></div>
        <div class="email" id="profileEmail"></div>
      </div>
    </div>

    <!-- Section Mes compétences -->
    <div class="section-title">
      <h3>Mes compétences</h3>
      <button class="btn-publish" onclick="ouvrirPublier()">+ Publier une compétence</button>
    </div>

    <div class="skills-panel">
      <div id="listeCompetences">
        <div class="empty-state">Chargement…</div>
      </div>
    </div>
  </main>

  <!-- ═══ MODAL PUBLIER UNE COMPÉTENCE ═══ -->
  <div class="modal-overlay" id="modalPublier" onclick="fermerPublierSiDehors(event)">
    <div class="modal-box">
      <h2>Publier une compétence</h2>
      <p>Indique la compétence que tu proposes d'enseigner aux autres étudiant·e·s.</p>
      <input type="text" id="inputCompetence" placeholder="Ex. : Python, Anglais, Guitare…" />
      <button class="btn-modal-p" id="btnPublier" onclick="publierCompetence()">Publier</button>
      <button class="btn-modal-g" onclick="fermerPublier()">Annuler</button>
    </div>
  </div>

  <!-- Toast de notification -->
  <style>
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1728; border: 1px solid #a855f7; color: #f1f0f5; padding: .75rem 1.5rem; border-radius: 99px; font-size: .88rem; font-weight: 600; opacity: 0; transition: all .3s; z-index: 999; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
  <div class="toast" id="toast"></div>

  <script>
    function afficherToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function initiales(prenom, nom) {
      return ((prenom || '?')[0] + (nom || '')[0]).toUpperCase();
    }

    function getUser() {
      try { return JSON.parse(localStorage.getItem('user')); } catch (e) { return null; }
    }

    function deconnexion() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    const user = getUser();
    if (!user || !user.idUser) {
      window.location.href = 'explorer.html';
    }

    function afficherProfil() {
      const init = initiales(user.prenomUser, user.nomUser);
      document.getElementById('sidebarAvatar').textContent = init;
      document.getElementById('sidebarName').textContent = `${user.prenomUser} ${user.nomUser}`;
      document.getElementById('profileAvatar').textContent = init;
      document.getElementById('profileName').textContent = `${user.prenomUser} ${user.nomUser}`;
      document.getElementById('profileSchool').textContent = user.universite ? `Étudiant·e · ${user.universite}` : 'Étudiant·e';
      document.getElementById('profileEmail').textContent = user.email || '';
    }

    async function chargerCompetences() {
      const conteneur = document.getElementById('listeCompetences');
      try {
        const rep = await fetch(`api/competences.php?action=mesCompetences&idUser=${user.idUser}`);
        const data = await rep.json();
        if (!rep.ok) {
          conteneur.innerHTML = `<div class="empty-state">${escapeHtml(data.erreur || 'Erreur de chargement.')}</div>`;
          return;
        }
        if (data.length === 0) {
          conteneur.innerHTML = '<div class="empty-state">Tu n\'as encore publié aucune compétence.</div>';
          return;
        }
        conteneur.innerHTML = data.map(c => `
          <div class="skill-row">
            <div class="skill-dot"></div>
            <div class="skill-row-info">
              <div class="skill-row-name">${escapeHtml(c.competence)}</div>
              <div class="skill-row-date">Publiée le ${new Date(c.dateEchange).toLocaleDateString('fr-FR')}</div>
            </div>
          </div>`).join('');
      } catch (e) {
        conteneur.innerHTML = '<div class="empty-state">Impossible de contacter le serveur. Vérifie que PHP et MySQL sont lancés.</div>';
      }
    }

    /* ── Publier une compétence ── */
    function ouvrirPublier() {
      document.getElementById('inputCompetence').value = '';
      document.getElementById('modalPublier').classList.add('visible');
    }
    function fermerPublier() { document.getElementById('modalPublier').classList.remove('visible'); }
    function fermerPublierSiDehors(e) { if (e.target === document.getElementById('modalPublier')) fermerPublier(); }

    async function publierCompetence() {
      const nom = document.getElementById('inputCompetence').value.trim();
      if (!nom) { afficherToast('Indique le nom de la compétence.'); return; }

      const btn = document.getElementById('btnPublier');
      btn.disabled = true;
      btn.textContent = 'Publication…';

      try {
        const rep = await fetch('api/competences.php?action=publier', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idUser: user.idUser, nom })
        });
        const json = await rep.json();

        if (!rep.ok) {
          afficherToast(json.erreur || 'Erreur lors de la publication.');
          return;
        }

        fermerPublier();
        afficherToast('Compétence publiée !');
        chargerCompetences();
      } catch (e) {
        afficherToast('Erreur réseau. Le serveur PHP est-il lancé ?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publier';
      }
    }

    if (user) {
      afficherProfil();
      chargerCompetences();
    }
  </script>

</body>
</html>
